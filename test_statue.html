<!DOCTYPE html>
<html>
<head>
<script src="vendor/three.min.js"></script>
<script src="vendor/GLTFLoader.js"></script>
<style>
body { margin: 0; background: #fff; overflow: hidden; }
canvas { width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 5);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const ambient = new THREE.AmbientLight(0xffffff, 0.8);
scene.add(ambient);
const dir = new THREE.DirectionalLight(0xffffff, 2.0);
dir.position.set(5, 5, 5);
scene.add(dir);

const loader = new THREE.GLTFLoader();
loader.load('assets/models/statue.glb', (gltf) => {
  const model = gltf.scene;
  const box = new THREE.Box3().setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  model.position.sub(center);
  const maxDim = Math.max(size.x, size.y, size.z);
  model.scale.multiplyScalar(3.0 / maxDim);
  scene.add(model);
  renderer.render(scene, camera);
  document.title = 'LOADED_STATUE';
}, undefined, (err) => {
  document.title = 'ERR:' + err;
});
</script>
</body>
</html>
